name: Check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run cf:build
      - run: npm run cf:check

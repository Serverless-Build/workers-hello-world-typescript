<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1026 681" width="1026" height="681" role="img" aria-labelledby="hello-world-worker-title hello-world-worker-description" style="font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif">
<title id="hello-world-worker-title">Hello World Worker</title>
<desc id="hello-world-worker-description">Four language entry points · one deterministic response · no bindings</desc>
<defs>
  <marker id="arrow-primary" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,1 L7,4 L0,7" fill="none" stroke="#F06000" stroke-width="1.2" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-secondary" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,1 L7,4 L0,7" fill="none" stroke="#8A6856" stroke-width="1.2" stroke-linejoin="round"/>
  </marker>
  <pattern id="dot-grid" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="8" cy="8" r="0.75" fill="#E8D5C4"/>
  </pattern>
  <marker id="arrow-legend" markerWidth="4" markerHeight="4" refX="3.5" refY="2" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0.3 L3.5,2 L0,3.7" fill="none" stroke="#7A5A4A" stroke-width="0.8" stroke-linejoin="round"/>
  </marker>
  <filter id="node-shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.05"/>
  </filter>
</defs>
<rect width="1026" height="681" fill="#FDF8F3"/>
<rect width="1026" height="681" fill="url(#dot-grid)"/>
<g>
  <rect x="376" y="149" width="274" height="296" rx="16" fill="rgba(255, 251, 245, 0.5)" stroke="#A97B5D" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="388" y="165" font-size="12" fill="#765747" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Cloudflare Developer Platform</text>
</g>
<line x1="337" y1="193" x2="337" y2="423" stroke="#E8D5C4" stroke-width="0.5" stroke-dasharray="6 4" opacity="0.3"/>
<line x1="663" y1="193" x2="663" y2="423" stroke="#E8D5C4" stroke-width="0.5" stroke-dasharray="6 4" opacity="0.3"/>
<path d="M292,308 L408,308" fill="none" stroke="#F06000" stroke-width="2" marker-end="url(#arrow-primary)"/>
<rect x="319.978" y="279" width="60.044" height="38" rx="19" fill="#FDF8F3" opacity="0.94"/>
<text x="350" y="294" font-size="11" fill="#7A5A4A" text-anchor="middle">HTTPS</text>
<text x="350" y="309" font-size="11" fill="#7A5A4A" text-anchor="middle">request</text>
<path d="M618,308 L734,308" fill="none" stroke="#F06000" stroke-width="2" marker-end="url(#arrow-primary)"/>
<rect x="628.3604" y="279" width="95.27919999999999" height="38" rx="19" fill="#FDF8F3" opacity="0.94"/>
<text x="676" y="294" font-size="11" fill="#7A5A4A" text-anchor="middle">200 OK</text>
<text x="676" y="309" font-size="11" fill="#7A5A4A" text-anchor="middle">text response</text>
<g filter="url(#node-shadow)">
  <rect x="82" y="237" width="210" height="142" rx="12" fill="#F5F0EB" stroke="#9A8070" stroke-width="1.5"/>
  <svg x="169" y="251" width="36" height="36" viewBox="0 0 48 48" color="#806455" fill="#806455"><circle cx="24" cy="14" r="8" fill="none" stroke="#806455" stroke-width="3"/><path d="M8 44c0-8.837 7.163-16 16-16s16 7.163 16 16" fill="none" stroke="#806455" stroke-width="3" stroke-linecap="round"/></svg>
  <text x="187" y="312" font-size="15" font-weight="650" fill="#4A1A0A" text-anchor="middle">HTTP client</text>
  <text x="187" y="336" font-size="12" font-weight="500" fill="#765747" text-anchor="middle">Any method, path, headers,</text>
  <text x="187" y="353" font-size="12" font-weight="500" fill="#765747" text-anchor="middle">or body</text>
</g>
<g filter="url(#node-shadow)">
  <rect x="408" y="203" width="210" height="210" rx="12" fill="#FFF4E8" stroke="#B84F08" stroke-width="1.5"/>
  <svg x="495" y="217" width="36" height="36" viewBox="0 0 48 49" color="#A94305" fill="#A94305"><path d="m18.63 37.418-9.645-12.9 9.592-12.533-1.852-2.527L5.917 23.595l-.015 1.808 10.86 14.542z"/><path d="M21.997 6.503h-3.712l13.387 18.3-13.072 17.7h3.735L35.4 24.81z"/><path d="M29.175 6.503h-3.758l13.598 18.082-13.598 17.918h3.765l12.908-17.01v-1.808z"/></svg>
  <text x="513" y="278" font-size="15" font-weight="650" fill="#4A1A0A" text-anchor="middle">hello-world Worker</text>
  <text x="513" y="302" font-size="12" font-weight="500" fill="#765747" text-anchor="middle">selected language entry point</text>
  <text x="513" y="319" font-size="12" font-weight="500" fill="#765747" text-anchor="middle">returns a constant text</text>
  <text x="513" y="336" font-size="12" font-weight="500" fill="#765747" text-anchor="middle">response</text>
  <rect x="454.248" y="351" width="117.50400000000003" height="20" rx="10" fill="#F8E4D4" stroke="#B84F08" stroke-width="0.75"/>
  <text x="513" y="364" font-size="10" fill="#6B260A" text-anchor="middle" font-weight="600">one request handler</text>
  <rect x="477.284" y="375" width="71.43199999999999" height="20" rx="10" fill="#F8E4D4" stroke="#B84F08" stroke-width="0.75"/>
  <text x="513" y="388" font-size="10" fill="#6B260A" text-anchor="middle" font-weight="600">no bindings</text>
</g>
<g filter="url(#node-shadow)">
  <rect x="734" y="223.5" width="210" height="169" rx="12" fill="#FFFDF8" stroke="#A98C73" stroke-width="1.5"/>
  <svg x="821" y="237.5" width="36" height="36" viewBox="0 0 32 32" color="#856B58" fill="#856B58"><g fill="none" stroke="#856B58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h17l5 5v19H5zM22 4v6h6M10 16h12M10 21h9"/></g></svg>
  <text x="839" y="298.5" font-size="15" font-weight="650" fill="#4A1A0A" text-anchor="middle">Delivered response</text>
  <text x="839" y="322.5" font-size="12" font-weight="500" fill="#765747" text-anchor="middle">200 · text/plain ·</text>
  <text x="839" y="339.5" font-size="12" font-weight="500" fill="#765747" text-anchor="middle">Cache-Control: no-store</text>
  <rect x="794.964" y="354.5" width="88.07199999999999" height="20" rx="10" fill="#F8E4D4" stroke="#B84F08" stroke-width="0.75"/>
  <text x="839" y="367.5" font-size="10" fill="#6B260A" text-anchor="middle" font-weight="600">constant body</text>
</g>
<g>
  <circle cx="286" cy="243" r="12" fill="#F06000" stroke="#FDF8F3" stroke-width="2"/>
  <text x="286" y="247" font-size="11" fill="#35140C" text-anchor="middle" font-weight="700">1</text>
</g>
<g>
  <circle cx="612" cy="209" r="12" fill="#F06000" stroke="#FDF8F3" stroke-width="2"/>
  <text x="612" y="213" font-size="11" fill="#35140C" text-anchor="middle" font-weight="700">2</text>
</g>
<g>
  <circle cx="910" cy="229.5" r="12" fill="#F06000" stroke="#FDF8F3" stroke-width="2"/>
  <text x="910" y="233.5" font-size="11" fill="#35140C" text-anchor="middle" font-weight="700">3</text>
</g>
<g>
  <circle cx="938" cy="229.5" r="12" fill="#F06000" stroke="#FDF8F3" stroke-width="2"/>
  <text x="938" y="233.5" font-size="11" fill="#35140C" text-anchor="middle" font-weight="700">4</text>
</g>
<text x="56" y="80" font-size="24" font-weight="700" fill="#4A1A0A">Hello World Worker</text>
<text x="56" y="100" font-size="14" font-weight="500" fill="#7A5A4A">Four language entry points · one deterministic response · no bindings</text>
<line x1="56" y1="459" x2="970" y2="459" stroke="#E8D5C4" stroke-width="0.75" opacity="0.5"/>
<g>
  <circle cx="65.6" cy="480.6" r="9.600000000000001" fill="#F06000"/>
  <text x="65.6" y="484.1" font-size="9.9" fill="#35140C" text-anchor="middle" font-weight="700">1</text>
  <text x="83.19999999999999" y="484.6" font-size="11" fill="#4A1A0A">Every route is accepted: The handler never</text>
  <text x="83.19999999999999" y="501.6" font-size="11" fill="#4A1A0A">inspects the URL, method, headers, or request</text>
  <text x="83.19999999999999" y="518.6" font-size="11" fill="#4A1A0A">body.</text>
</g>
<g>
  <circle cx="391.6" cy="480.6" r="9.600000000000001" fill="#F06000"/>
  <text x="391.6" y="484.1" font-size="9.9" fill="#35140C" text-anchor="middle" font-weight="700">2</text>
  <text x="409.20000000000005" y="484.6" font-size="11" fill="#4A1A0A">One runtime entry point: JS/TS use a module</text>
  <text x="409.20000000000005" y="501.6" font-size="11" fill="#4A1A0A">handler, Python uses WorkerEntrypoint, and</text>
  <text x="409.20000000000005" y="518.6" font-size="11" fill="#4A1A0A">Rust compiles to WebAssembly.</text>
</g>
<g>
  <circle cx="717.6" cy="480.6" r="9.600000000000001" fill="#F06000"/>
  <text x="717.6" y="484.1" font-size="9.9" fill="#35140C" text-anchor="middle" font-weight="700">3</text>
  <text x="735.2" y="484.6" font-size="11" fill="#4A1A0A">Explicitly uncacheable: The response sets</text>
  <text x="735.2" y="501.6" font-size="11" fill="#4A1A0A">text/plain UTF-8 and Cache-Control:</text>
  <text x="735.2" y="518.6" font-size="11" fill="#4A1A0A">no-store.</text>
</g>
<g>
  <circle cx="717.6" cy="535.6" r="9.600000000000001" fill="#F06000"/>
  <text x="717.6" y="539.1" font-size="9.9" fill="#35140C" text-anchor="middle" font-weight="700">4</text>
  <text x="735.2" y="539.6" font-size="11" fill="#4A1A0A">No background work: No persistence,</text>
  <text x="735.2" y="556.6" font-size="11" fill="#4A1A0A">scheduled event, queue, waitUntil task,</text>
  <text x="735.2" y="573.6" font-size="11" fill="#4A1A0A">or downstream API.</text>
</g>
<g>
  <text x="56" y="619" font-size="14" fill="#7A5A4A">Any HTTP request invokes one fetch handler and receives the same no-store text response.</text>
</g>
</svg>